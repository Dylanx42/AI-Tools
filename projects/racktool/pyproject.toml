[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racktool"
version = "0.1.0"
description = "Offline-first Excel rack management for RackTool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.6,<7",
]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "types-openpyxl>=3.1,<4",
  "types-PyYAML>=6,<7",
]

[project.scripts]
racktool = "racktool.cli.main:main"
racktool-gui = "racktool.gui.window:launch_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
racktool = ["profiles/*.yaml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["racktool"]
