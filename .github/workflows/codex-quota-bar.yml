name: codex-quota-bar

on:
  push:
    paths:
      - "projects/codex-quota-bar/**"
      - ".github/workflows/codex-quota-bar.yml"
  pull_request:
    paths:
      - "projects/codex-quota-bar/**"
      - ".github/workflows/codex-quota-bar.yml"
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    defaults:
      run:
        working-directory: projects/codex-quota-bar
    steps:
      - uses: actions/checkout@v4
      - name: Validate plist
        run: plutil -lint Info.plist
      - name: Offline account and quota regressions
        run: ./test.sh
      - name: Build
        run: ./build.sh
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/Codex 额度栏.app"
          lipo "dist/Codex 额度栏.app/Contents/MacOS/CodexQuotaBar" -verify_arch arm64 x86_64
      - name: Package and verify installation archive
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Codex 额度栏.app" dist/Codex-Quota-Bar.zip
          ditto -x -k dist/Codex-Quota-Bar.zip .build/package-check
          test -x ".build/package-check/Codex 额度栏.app/Contents/MacOS/CodexQuotaBar"
          codesign --verify --deep --strict --verbose=2 ".build/package-check/Codex 额度栏.app"
      - name: Upload installation archive
        uses: actions/upload-artifact@v4
        with:
          name: codex-quota-bar-macos
          path: projects/codex-quota-bar/dist/Codex-Quota-Bar.zip
