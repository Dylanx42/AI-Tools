name: RackTool Windows package

on:
  push:
    branches:
      - main
      - fix/racktool-gui-redesign
    paths:
      - "projects/racktool/**"
      - ".github/workflows/racktool-windows.yml"
  pull_request:
    paths:
      - "projects/racktool/**"
      - ".github/workflows/racktool-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: projects/racktool
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RackTool and packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui]" pyinstaller

      - name: Verify import before packaging
        run: python -c "import racktool; from racktool.gui.window import launch"

      - name: Build portable executable
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Create distributable archive
        shell: pwsh
        run: Compress-Archive -Path dist/RackTool -DestinationPath dist/RackTool-windows-x86_64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: racktool-windows-x86_64
          path: projects/racktool/dist/RackTool-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
